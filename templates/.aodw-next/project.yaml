project_name: VoiceX

# ── 以下均为**可选**声明块：不写则行为完全不变 ──────────────────────────────
# 这里给的是格式说明，不是实例值。接入的项目按需取消注释并填自己的值。

# ── 采纳溯源（可选）─────────────────────────────────────────────────────────
# 记录本项目的 .aodw-next/ 是从哪儿、哪个版本、什么时候拷过来的。
# 纯元数据：没有任何工具依据它改变行为，只为「这份规则是哪来的」可追溯。
# 同一份声明也可写在 manifest.yaml 的 adoption 块里（二选一或都写）。
#
# adoption:
#   source_project: <上游项目标识>
#   source_commit: <上游 commit SHA>
#   adopted_at: YYYY-MM-DD
#   project_specific_layer: 06-project     # 本项目自留层的目录名
#
# ⚠️ 完整性校验（对 .aodw-next/ 逐文件算 checksum 生成 lock 文件、
# 升级时比对漂移）目前**没有实现**，也不要凭空发明格式。它作为将来的扩展
# 记录在 README.md「采纳溯源」一节，等有真实需求和实现时再定契约。

# ── 门禁作用域（可选）───────────────────────────────────────────────────────
# 解决的问题：在已有大量存量 RT 的项目里中途接入 AODW 时，`rt-guard.sh --root .`
# 不带 --rt 会扫全部 RT，其中绝大多数建于接入之前、用的是另一套文档形态，
# 扫出来的告警全是「历史不是新格式」，把真正的新问题淹掉。
# 宪章的态度是：历史内容只作证据，不倒改。
#
# **本块是给仓库级检查脚本读的元数据，rt-guard.sh 自身不读它、行为不受影响。**
# 不写本块 = 现状（rt-guard 逐 RT 检查，作用域由调用方用 --rt 决定）。
#
# rt_gate_scope:
#   # 第一个在 AODW 下建立的 RT。序号 >= 它的即为受管 RT。
#   managed_from: RT-XXX
#   # 受管面之外的 RT 怎么处置：不回填、不改写，只在 RT/index.yaml 里打
#   # `backfill: <标记>`，AODW 自带的 G101/G111 据此豁免（见 rt-manager.md §3.4d）。
#   legacy_policy: evidence-only
#   # 全量人工体检是否需要显式要求（默认不跑，因为输出里绝大多数是存量告警）
#   full_scan_is_opt_in: true
